<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboard | Quiz Platform</title>
    <link rel="stylesheet" href="./assets/css/style.css?v=2.6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Mobile Topbar -->
    <header class="mobile-topbar">
        <a href="index.html" class="logo-bold">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            QUIZ PLATFORM
        </a>
        <button id="mobile-menu-toggle" class="menu-toggle-btn" aria-label="Toggle navigation menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </header>

    <div id="mobile-overlay" class="mobile-overlay"></div>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo-area">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        <span>QUIZ PLATFORM</span>
                    </h2>
                </a>
                <button id="close-drawer-btn" class="close-drawer-btn">&times;</button>
            </div>
            <nav class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Browse Quizzes</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="leaderboard.html" class="nav-link active">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20V10"></path>
                            <path d="M18 20V4"></path>
                            <path d="M6 20v-4"></path>
                        </svg>
                        <span>Leaderboard</span>
                    </a>
                </li>
                <li class="nav-item" id="profile-nav-item" style="display: none;">
                    <a href="profile.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>My Profile</span>
                    </a>
                </li>
                <li class="nav-item" id="auth-nav-item">
                    <!-- Dynamic auth element -->
                </li>
            </nav>
            <div class="sidebar-footer">
                <div id="user-info" class="user-sidebar-pill" style="display: none;">
                    <div class="user-details-box">
                        <div class="user-avatar-sm" id="sidebar-avatar">?</div>
                        <div class="user-text-content">
                            <p class="user-name-label"><span id="display-username"></span></p>
                            <button onclick="logout()" class="logout-link">Logout</button>
                        </div>
                    </div>
                </div>
                <p style="font-size: 0.75rem; color: #9ca3af;">&copy; 2026 Quiz Platform v2.0</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="header-meta">
                <h1>Global Leaderboard</h1>
                <p>Top performers across all quiz categories.</p>
            </header>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>User Name</th>
                            <th>Category</th>
                            <th>Score</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                Loading leaderboard records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="./assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/get_leaderboard')
                .then(res => res.json())
                .then(result => {
                    const tbody = document.getElementById('leaderboard-body');
                    tbody.innerHTML = '';

                    if (result.success && result.data && result.data.length > 0) {
                        result.data.forEach((row, index) => {
                            const rank = index + 1;
                            const tr = document.createElement('tr');

                            let rankClass = 'rank-pill';
                            if (rank === 1) rankClass += ' rank-1';
                            else if (rank === 2) rankClass += ' rank-2';
                            else if (rank === 3) rankClass += ' rank-3';

                            const colors = ['#eff6ff', '#fdf2f8', '#ecfdf5', '#fff7ed', '#f5f3ff'];
                            const bgColor = colors[index % colors.length];

                            tr.innerHTML = `
                                <td><span class="${rankClass}">#${rank}</span></td>
                                <td>
                                    <div class="user-cell">
                                        <div class="avatar" style="background: ${bgColor}; color: #1d4ed8;">
                                            ${row.username.charAt(0).toUpperCase()}
                                        </div>
                                        <strong>${row.username}</strong>
                                    </div>
                                </td>
                                <td>${row.category}</td>
                                <td><strong style="color: var(--primary);">${row.score}%</strong></td>
                                <td>${row.time_taken || '01:00'}</td>
                                <td><span class="status-tag">Verified</span></td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 48px; color: var(--text-muted);">
                                    No scores found yet. Complete a quiz to take the #1 spot!
                                </td>
                            </tr>
                        `;
                    }
                })
                .catch(err => {
                    console.error('Leaderboard error:', err);
                    document.getElementById('leaderboard-body').innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px; color: #dc2626;">
                                Could not load leaderboard records. Please try again.
                            </td>
                        </tr>
                    `;
                });
        });
    </script>
</body>

</html>
