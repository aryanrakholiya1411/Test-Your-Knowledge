<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Quiz Platform</title>
    <link rel="stylesheet" href="./assets/css/style.css?v=2.6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>QUIZ PLATFORM</h1>
                <p>Create your new account</p>
            </div>

            <div id="msg-box"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Choose a username" required minlength="3" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="example@gmail.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="4" autocomplete="new-password">
                </div>
                <button type="submit" id="submit-btn" class="btn-base btn-primary" style="width: 100%; margin-top: 12px;">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
            <div class="auth-footer" style="margin-top: 8px;">
                <a href="index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('msg-box');
            const submitBtn = document.getElementById('submit-btn');

            msgBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const result = await response.json();

                msgBox.style.display = 'block';
                if (result.success) {
                    msgBox.className = 'success-msg';
                    msgBox.textContent = result.message || 'Account created successfully! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    msgBox.className = 'error-msg';
                    msgBox.textContent = result.message || 'Registration failed.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            } catch (err) {
                console.error(err);
                msgBox.style.display = 'block';
                msgBox.className = 'error-msg';
                msgBox.textContent = 'Could not connect to server. Please check your connection.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>

</html>
